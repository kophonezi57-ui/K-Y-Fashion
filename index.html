<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">

<title>K&Y Fashion</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans Myanmar",sans-serif;
  background:#f6f6f6;
  color:#222;
}
button,input,select{font:inherit}
button{cursor:pointer;border:0}

.header{
  position:sticky;
  top:0;
  z-index:20;
  background:#111;
  color:white;
  padding:14px;
}
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.logo{
  font-size:21px;
  font-weight:bold;
}
.cart-btn{
  background:white;
  color:#111;
  border-radius:20px;
  padding:8px 13px;
}
.search{
  margin-top:12px;
  width:100%;
  padding:12px 15px;
  border:0;
  border-radius:12px;
  outline:none;
}
.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:12px;
  background:white;
}
.cat{
  white-space:nowrap;
  padding:9px 14px;
  border-radius:20px;
  background:#eee;
}
.cat.active{
  background:#111;
  color:white;
}
.container{
  padding:12px;
  max-width:900px;
  margin:auto;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.card{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 8px #00000012;
}
.card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  background:#eee;
}
.card-body{padding:10px}
.name{
  font-weight:bold;
  margin-bottom:7px;
}
.price{
  font-size:18px;
  font-weight:bold;
}
.old{
  text-decoration:line-through;
  color:#999;
  font-size:13px;
  margin-left:5px;
}
.card button{
  width:100%;
  margin-top:9px;
  padding:10px;
  border-radius:10px;
  background:#111;
  color:white;
}
.empty{
  text-align:center;
  padding:50px 10px;
  color:#777;
}
.page{display:none}
.page.active{display:block}
.back{
  background:#eee;
  padding:9px 14px;
  border-radius:10px;
  margin-bottom:12px;
}
.detail{
  background:white;
  border-radius:15px;
  overflow:hidden;
}
.detail img{
  width:100%;
  max-height:430px;
  object-fit:cover;
}
.detail-body{padding:16px}
.detail-title{
  font-size:24px;
  font-weight:bold;
}
.detail-price{
  font-size:23px;
  font-weight:bold;
  margin:10px 0;
}
.option{margin:15px 0}
.option-title{
  font-weight:bold;
  margin-bottom:8px;
}
.option-list{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.opt{
  padding:9px 14px;
  border:1px solid #ccc;
  background:white;
  border-radius:9px;
}
.opt.selected{
  background:#111;
  color:white;
  border-color:#111;
}
.big-btn{
  width:100%;
  padding:14px;
  border-radius:12px;
  background:#111;
  color:white;
  font-weight:bold;
  margin-top:10px;
}
.cart-item{
  display:flex;
  gap:10px;
  background:white;
  padding:10px;
  margin-bottom:10px;
  border-radius:12px;
}
.cart-item img{
  width:75px;
  height:75px;
  object-fit:cover;
  border-radius:9px;
}
.cart-info{flex:1}
.qty{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:8px;
}
.qty button{
  width:30px;
  height:30px;
  border-radius:7px;
  background:#eee;
}
.total-box{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-top:12px;
}
.total-row{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
}
.total{
  font-size:21px;
  font-weight:bold;
}
.form{
  background:white;
  padding:15px;
  border-radius:14px;
}
.form label{
  display:block;
  font-weight:bold;
  margin-top:12px;
  margin-bottom:5px;
}
.form input,
.form textarea,
.form select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:9px;
  outline:none;
}
.form textarea{
  min-height:90px;
  resize:vertical;
}
.payment{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.pay{
  padding:12px 5px;
  background:#eee;
  border-radius:10px;
}
.pay.selected{
  background:#111;
  color:white;
}
.order{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:10px;
}
.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  padding:8px;
  z-index:30;
}
.nav button{
  background:none;
  padding:5px;
  color:#555;
}
.nav button.active{
  color:#111;
  font-weight:bold;
}
main{padding-bottom:75px}

@media(min-width:650px){
  .grid{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>

<body>

<header class="header">
  <div class="top">
    <div class="logo">K&Y Fashion</div>
    <button class="cart-btn" onclick="showPage('cart')">
      🛒 <span id="cartCount">0</span>
    </button>
  </div>

  <input
    id="search"
    class="search"
    placeholder="အထည်ရှာရန်..."
    oninput="renderProducts()"
  >
</header>

<main>

<section id="home" class="page active">

  <div class="categories" id="categories">
    <button class="cat active" onclick="selectCategory('all',this)">
      အားလုံး
    </button>
    <button class="cat" onclick="selectCategory('T-shirt',this)">
      T-shirt
    </button>
    <button class="cat" onclick="selectCategory('Box Tee',this)">
      Box Tee
    </button>
    <button class="cat" onclick="selectCategory('Pants',this)">
      Pants
    </button>
    <button class="cat" onclick="selectCategory('Dress',this)">
      Dress
    </button>
    <button class="cat" onclick="selectCategory('Bag',this)">
      Bag
    </button>
    <button class="cat" onclick="selectCategory('Shoes',this)">
      Shoes
    </button>
  </div>

  <div class="container">
    <div id="products" class="grid"></div>
  </div>

</section>

<section id="detail" class="page">
  <div class="container">
    <button class="back" onclick="showPage('home')">
      ← နောက်သို့
    </button>
    <div id="detailContent"></div>
  </div>
</section>

<section id="cart" class="page">
  <div class="container">
    <h2>🛒 Shopping Cart</h2>
    <div id="cartItems"></div>
    <div id="cartTotal"></div>
  </div>
</section>

<section id="checkout" class="page">
  <div class="container">

    <button class="back" onclick="showPage('cart')">
      ← Cart
    </button>

    <h2>📦 အော်ဒါတင်ရန်</h2>

    <div class="form">

      <label>အမည်</label>
      <input id="customerName" placeholder="အမည်">

      <label>ဖုန်းနံပါတ်</label>
      <input id="customerPhone" placeholder="09xxxxxxxxx">

      <label>ပို့ရမည့်လိပ်စာ</label>
      <textarea
        id="customerAddress"
        placeholder="လိပ်စာရေးပါ">
      </textarea>

      <label>ငွေပေးချေမှု</label>

      <div class="payment">

        <button class="pay"
          onclick="selectPayment(this,'KBZPay')">
          KBZPay
        </button>

        <button class="pay"
          onclick="selectPayment(this,'WavePay')">
          WavePay
        </button>

        <button class="pay"
          onclick="selectPayment(this,'AYA Pay')">
          AYA Pay
        </button>

      </div>

      <label>ငွေလွှဲ Screenshot</label>

      <input
        type="file"
        id="paymentSlip"
        accept="image/*">

      <div id="checkoutTotal"></div>

      <button
        class="big-btn"
        onclick="placeOrder()">
        အော်ဒါတင်မည်
      </button>

    </div>
  </div>
</section>

<section id="tracking" class="page">

  <div class="container">

    <h2>📦 Order Tracking</h2>

    <div class="form">

      <label>အော်ဒါဖုန်းနံပါတ်</label>

      <input
        id="trackPhone"
        placeholder="09xxxxxxxxx">

      <button
        class="big-btn"
        onclick="trackOrder()">
        အော်ဒါရှာမည်
      </button>

    </div>

    <div id="orders"></div>

  </div>

</section>

</main>

<nav class="nav">

  <button
    class="active"
    onclick="showPage('home');setNav(this)">
    🏠<br>Home
  </button>

  <button
    onclick="showPage('cart');setNav(this)">
    🛒<br>Cart
  </button>

  <button
    onclick="showPage('tracking');setNav(this)">
    📦<br>Order
  </button>

</nav>

<script>

const products = [

  {
    id:1,
    name:"Thailand 100% Cotton T-shirt",
    category:"T-shirt",
    price:8000,
    oldPrice:0,
    image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=800",
    sizes:["S","M","L","XL","2XL"],
    colors:["White","Black"],
    description:"Thailand 100% Cotton T-shirt"
  },

  {
    id:2,
    name:"GSM 240 Box Tee",
    category:"Box Tee",
    price:23000,
    oldPrice:0,
    image:"https://images.unsplash.com/photo-1503341504253-dff4815485f1?w=800",
    sizes:["Free Size"],
    colors:["White","Black"],
    description:"GSM 240 Box Tee"
  },

  {
    id:3,
    name:"Air Layer GSM350",
    category:"Box Tee",
    price:33000,
    oldPrice:0,
    image:"https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?w=800",
    sizes:["Free Size"],
    colors:["Black","White"],
    description:"Air Layer smooth GSM350"
  },

  {
    id:4,
    name:"Casual Pants",
    category:"Pants",
    price:18000,
    oldPrice:0,
    image:"https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=800",
    sizes:["M","L","XL"],
    colors:["Black","Brown"],
    description:"နေ့စဉ်ဝတ်လို့အဆင်ပြေတဲ့ Pants"
  }

];

let selectedCategory="all";
let selectedProduct=null;
let selectedOptions={};
let selectedPayment="";

let cart=JSON.parse(
  localStorage.getItem("ky_cart")||"[]"
);

function showPage(page){

  document.querySelectorAll(".page")
    .forEach(x=>x.classList.remove("active"));

  document.getElementById(page)
    .classList.add("active");

  if(page==="cart") renderCart();

  if(page==="checkout") renderCheckout();

  window.scrollTo(0,0);
}

function setNav(btn){

  document.querySelectorAll(".nav button")
    .forEach(x=>x.classList.remove("active"));

  btn.classList.add("active");
}

function selectCategory(category,btn){

  selectedCategory=category;

  document.querySelectorAll(".cat")
    .forEach(x=>x.classList.remove("active"));

  btn.classList.add("active");

  renderProducts();
}

function renderProducts(){

  const box=document.getElementById("products");

  const keyword=document
    .getElementById("search")
    .value
    .toLowerCase()
    .trim();

  let list=products.filter(p=>{

    const categoryOK=
      selectedCategory==="all" ||
      p.category===selectedCategory;

    const searchOK=
      p.name.toLowerCase().includes(keyword);

    return categoryOK && searchOK;

  });

  if(!list.length){

    box.innerHTML=
      `<div class="empty">ပစ္စည်းမတွေ့ပါ</div>`;

    return;
  }

  box.innerHTML=list.map(p=>`

    <div class="card">

      <img
        src="${p.image}"
        onclick="openProduct(${p.id})">

      <div class="card-body">

        <div class="name">
          ${p.name}
        </div>

        <div class="price">
          ${p.price.toLocaleString()} Ks
        </div>

        <button onclick="openProduct(${p.id})">
          ကြည့်မည်
        </button>

      </div>

    </div>

  `).join("");
}

function openProduct(id){

  const p=products.find(x=>x.id===id);

  if(!p)return;

  selectedProduct=p;
  selectedOptions={};

  let html=`

    <div class="detail">

      <img src="${p.image}">

      <div class="detail-body">

        <div class="detail-title">
          ${p.name}
        </div>

        <div class="detail-price">
          ${p.price.toLocaleString()} Ks
        </div>

        <p>${p.description}</p>
  `;

  if(p.sizes?.length){

    html+=`

      <div class="option">

        <div class="option-title">
          Size
        </div>

        <div class="option-list">

          ${p.sizes.map(size=>`

            <button
              class="opt"
              onclick="chooseOption(this,'size','${size}')">
              ${size}
            </button>

          `).join("")}

        </div>

      </div>

    `;
  }

  if(p.colors?.length){

    html+=`

      <div class="option">

        <div class="option-title">
          Color
        </div>

        <div class="option-list">

          ${p.colors.map(color=>`

            <button
              class="opt"
              onclick="chooseOption(this,'color','${color}')">
              ${color}
            </button>

          `).join("")}

        </div>

      </div>

    `;
  }

  html+=`

        <button
          class="big-btn"
          onclick="addToCart()">
          🛒 Cart ထဲထည့်မည်
        </button>

      </div>

    </div>

  `;

  document.getElementById("detailContent")
    .innerHTML=html;

  showPage("detail");
}

function chooseOption(btn,type,value){

  btn.parentElement
    .querySelectorAll(".opt")
    .forEach(x=>x.classList.remove("selected"));

  btn.classList.add("selected");

  selectedOptions[type]=value;
}

function addToCart(){

  if(!selectedProduct)return;

  const exists=cart.find(x=>
    x.id===selectedProduct.id &&
    JSON.stringify(x.options)===
    JSON.stringify(selectedOptions)
  );

  if(exists){

    exists.qty++;

  }else{

    cart.push({
      id:selectedProduct.id,
      name:selectedProduct.name,
      price:selectedProduct.price,
      image:selectedProduct.image,
      options:{...selectedOptions},
      qty:1
    });

  }

  saveCart();

  alert("🛒 Cart ထဲထည့်ပြီးပါပြီ");

  showPage("cart");
}

function saveCart(){

  localStorage.setItem(
    "ky_cart",
    JSON.stringify(cart)
  );

  updateCartCount();
}

function updateCartCount(){

  const count=cart.reduce(
    (sum,x)=>sum+x.qty,0
  );

  document.getElementById("cartCount")
    .textContent=count;
}

function renderCart(){

  const box=document.getElementById("cartItems");

  if(!cart.length){

    box.innerHTML=
      `<div class="empty">
        🛒 Cart ထဲမှာ ပစ္စည်းမရှိသေးပါ
      </div>`;

    document.getElementById("cartTotal")
      .innerHTML="";

    return;
  }

  box.innerHTML=cart.map((item,index)=>`

    <div class="cart-item">

      <img src="${item.image}">

      <div class="cart-info">

        <b>${item.name}</b>

        <div>
          ${Object.values(item.options).join(" / ")}
        </div>

        <div>
          ${item.price.toLocaleString()} Ks
        </div>

        <div class="qty">

          <button onclick="changeQty(${index},-1)">
            −
          </button>

          <b>${item.qty}</b>

          <button onclick="changeQty(${index},1)">
            +
          </button>

          <button onclick="removeCart(${index})">
            🗑️
          </button>

        </div>

      </div>

    </div>

  `).join("");

  const total=cart.reduce(
    (sum,x)=>sum+x.price*x.qty,0
  );

  document.getElementById("cartTotal").innerHTML=`

    <div class="total-box">

      <div class="total-row">
        <span>စုစုပေါင်း</span>
        <b>${total.toLocaleString()} Ks</b>
      </div>

      <div class="total-row">
        <span>Delivery</span>
        <b>တွက်ချက်ပေးမည်</b>
      </div>

      <div class="total-row total">
        <span>Total</span>
        <span>${total.toLocaleString()} Ks</span>
      </div>

      <button
        class="big-btn"
        onclick="showPage('checkout')">
        Checkout
      </button>

    </div>

  `;
}

function changeQty(index,num){

  cart[index].qty+=num;

  if(cart[index].qty<=0){
    cart.splice(index,1);
  }

  saveCart();
  renderCart();
}

function removeCart(index){

  cart.splice(index,1);

  saveCart();
  renderCart();
}

function renderCheckout(){

  const total=cart.reduce(
    (sum,x)=>sum+x.price*x.qty,0
  );

  document.getElementById("checkoutTotal")
    .innerHTML=`

      <div class="total-box">

        <div class="total-row total">
          <span>Total</span>
          <span>${total.toLocaleString()} Ks</span>
        </div>

      </div>

    `;
}

function selectPayment(btn,payment){

  document.querySelectorAll(".pay")
    .forEach(x=>x.classList.remove("selected"));

  btn.classList.add("selected");

  selectedPayment=payment;
}

function placeOrder(){

  if(!cart.length){

    alert("Cart ထဲမှာ ပစ္စည်းမရှိပါ");

    return;
  }

  const name=document
    .getElementById("customerName")
    .value.trim();

  const phone=document
    .getElementById("customerPhone")
    .value.trim();

  const address=document
    .getElementById("customerAddress")
    .value.trim();

  const slip=document
    .getElementById("paymentSlip")
    .files[0];

  if(!name || !phone || !address){

    alert("အမည်၊ ဖုန်း၊ လိပ်စာ ဖြည့်ပါ");

    return;
  }

  if(!selectedPayment){

    alert("ငွေပေးချေမှုနည်းလမ်း ရွေးပါ");

    return;
  }

  if(!slip){

    alert("ငွေလွှဲ Screenshot တင်ပါ");

    return;
  }

  const total=cart.reduce(
    (sum,x)=>sum+x.price*x.qty,0
  );

  const order={

    id:"KY"+Date.now(),

    name:name,

    phone:phone,

    address:address,

    payment:selectedPayment,

    total:total,

    items:cart,

    status:"အော်ဒါလက်ခံပြီး",

    date:new Date().toLocaleString()

  };

  const orders=JSON.parse(
    localStorage.getItem("ky_orders")||"[]"
  );

  orders.push(order);

  localStorage.setItem(
    "ky_orders",
    JSON.stringify(orders)
  );

  cart=[];

  saveCart();

  alert(
    "✅ အော်ဒါတင်ပြီးပါပြီ\n\n"+
    "Order ID: "+order.id
  );

  showPage("tracking");

  document.getElementById("trackPhone")
    .value=phone;

  trackOrder();
}

function trackOrder(){

  const phone=document
    .getElementById("trackPhone")
    .value.trim();

  const orders=JSON.parse(
    localStorage.getItem("ky_orders")||"[]"
  );

  const found=orders.filter(
    x=>x.phone===phone
  );

  const box=document.getElementById("orders");

  if(!found.length){

    box.innerHTML=
      `<div class="empty">
        အော်ဒါမတွေ့ပါ
      </div>`;

    return;
  }

  box.innerHTML=found.reverse().map(o=>`

    <div class="order">

      <b>Order ID: ${o.id}</b>

      <p>📅 ${o.date}</p>

      <p>💳 ${o.payment}</p>

      <p>💰 ${o.total.toLocaleString()} Ks</p>

      <p>
        📦 <b>${o.status}</b>
      </p>

    </div>

  `).join("");
}

renderProducts();
updateCartCount();

</script>

</body>
</html>
